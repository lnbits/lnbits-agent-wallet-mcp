[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lnbits-agent-wallet-mcp"
version = "0.1.0"
description = "Tiny MCP server for scoped LNbits agent_wallet runtime actions"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Tal Vasconcelos" }]
keywords = ["mcp", "lnbits", "agent-wallet", "lightning", "bitcoin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.25.0",
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.5.0",
]

[project.scripts]
lnbits-agent-wallet-mcp = "lnbits_agent_wallet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lnbits_agent_wallet_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
